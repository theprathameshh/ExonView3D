[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exonview3d"
version = "0.1.0"
description = "Gene-to-exon mapping and 3D protein structure visualization"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "biopython>=1.80"
]

[project.scripts]
exonview3d = "exonview3d.cli:main"

[tool.setuptools.packages.find]
include = ["exonview3d*"]
